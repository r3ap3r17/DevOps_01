# CI/CD for the voting app.
#
#   static + unit  ->  build (matrix)  ->  scan + integration  ->  publish  ->  staging  ->  production
#   (fail fast)        (layer cache)       (gates)                 (main only, immutable tags)  (approval)
#
# Pull requests run everything up to and including scan + integration.
# Pushes to main also publish the images and deploy them.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: Build without the layer cache (to measure a cold build)
        type: boolean
        default: false

# Newer commits on a PR cancel older runs. Runs on main never cancel each other,
# so a deploy is never cut off halfway (run_id makes every main run its own group).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_OFF: ${{ inputs.no_cache == true }}

jobs:
  # ---------------------------------------------------------------- trunk-based
  branch-age:
    name: branch age
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WARN_DAYS: 2
      MAX_DAYS: 5
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Branch is short-lived
        run: |
          oldest="$(git log --format=%at "origin/${BASE_REF}..HEAD" | tail -n 1)"
          if [ -z "$oldest" ]; then
            echo "No commits ahead of ${BASE_REF}."
            exit 0
          fi
          age_days=$(( ( $(date +%s) - oldest ) / 86400 ))
          echo "Oldest commit on this branch is ${age_days} day(s) old."
          if [ "$age_days" -gt "$MAX_DAYS" ]; then
            echo "::error::Branch is ${age_days} days old (limit ${MAX_DAYS}). Merge smaller pieces or split the work."
            exit 1
          elif [ "$age_days" -gt "$WARN_DAYS" ]; then
            echo "::warning::Branch is ${age_days} days old. Trunk-based flow aims to merge within ${WARN_DAYS} days."
          fi

  # ---------------------------------------------------------------- fast checks
  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actions are pinned to a version or commit SHA
        run: |
          bad="$(grep -rnE '^[[:space:]-]*uses:[[:space:]]*[^.[:space:]]' .github/workflows \
            | grep -vE '@([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]]|$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Pin every action to an exact version (vX.Y.Z) or a commit SHA, never a branch or a major tag:"
            echo "$bad"
            exit 1
          fi

      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color -shellcheck=

      - name: Lint Dockerfile (vote)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: services/vote/Dockerfile
          failure-threshold: error
      - name: Lint Dockerfile (result)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: services/result/Dockerfile
          failure-threshold: error
      - name: Lint Dockerfile (worker)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: services/worker/Dockerfile
          failure-threshold: error

  # The upstream app ships no unit tests, so this stage proves each service
  # installs its dependencies, compiles and loads, using the service's own toolchain.
  unit:
    name: unit (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        service: [vote, result, worker]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # vote: Python / Flask
      - if: matrix.service == 'vote'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/vote/requirements.txt
      - if: matrix.service == 'vote'
        name: Install, compile, lint, import
        run: |
          pip install -r requirements.txt ruff==0.6.9
          python -m compileall -q .
          ruff check --select E9,F63,F7,F82 .
          python -c "import app"

      # result: Node / Express
      - if: matrix.service == 'result'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: services/result/package-lock.json
      - if: matrix.service == 'result'
        name: Install, syntax check, resolve dependencies
        run: |
          npm ci
          node --check server.js
          node --check views/app.js
          node -e "for (const d of Object.keys(require('./package.json').dependencies)) require.resolve(d)"

      # worker: .NET
      - if: matrix.service == 'worker'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - if: matrix.service == 'worker'
        name: Build
        run: dotnet build --configuration Release

  # ---------------------------------------------------------------- build
  build:
    name: build (${{ matrix.service }})
    needs: [static, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: vote
            target: final # skip the dev stage
          - service: result
            target: ""
          - service: worker
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          target: ${{ matrix.target }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.service }}
          # One cache per service, so the matrix legs don't evict each other.
          cache-from: ${{ env.CACHE_OFF != 'true' && format('type=gha,scope={0}', matrix.service) || '' }}
          cache-to: ${{ env.CACHE_OFF != 'true' && format('type=gha,mode=max,scope={0}', matrix.service) || '' }}
          no-cache: ${{ env.CACHE_OFF == 'true' }}
          provenance: false
          sbom: false
          # Build once, then hand the exact same image to scan, integration and publish.
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.service }}.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar
          retention-days: 1
          compression-level: 1

  # ---------------------------------------------------------------- gates
  scan:
    name: scan (${{ matrix.service }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        service: [vote, result, worker]
    steps:
      - name: Image name
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}
      - name: Load image
        run: docker load --input "${RUNNER_TEMP}/${{ matrix.service }}.tar"
      - name: Scan for vulnerabilities (fail on fixable critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  integration:
    name: integration
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        run: |
          for f in "${RUNNER_TEMP}"/images/*.tar; do
            docker load --input "$f"
          done
      - name: End-to-end test (vote -> redis -> worker -> db -> result)
        run: docker compose --file ci/compose.yml up --build --exit-code-from sut sut
      - name: Service logs
        if: failure()
        run: docker compose --file ci/compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --file ci/compose.yml down --volumes

  # ---------------------------------------------------------------- release
  publish:
    name: publish (${{ matrix.service }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [scan, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [vote, result, worker]
    steps:
      - name: Image name
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}
      - name: Push the tested image (immutable tag)
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image="${IMAGE_PREFIX}/${SERVICE}:sha-${GITHUB_SHA}"
          docker load --input "${RUNNER_TEMP}/${SERVICE}.tar"
          # GHCR cannot lock tags, so the pipeline refuses to overwrite one.
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "::warning::${image} already exists and is left untouched (tags are immutable)."
          else
            docker push "$image"
          fi

  deploy-staging:
    name: staging
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      version: ${{ github.sha }}

  deploy-production:
    name: production
    needs: deploy-staging
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      version: ${{ github.sha }}
