# CI/CD for the voting app.
#
#   static + unit  ->  build (matrix)  ->  scan  ->  publish  ->  staging  ->  production
#   (fail fast)        (layer cache)       (gate)    (main only, immutable tags)  (approval)
#
# Pushes to any branch run the fast checks (static + unit) only.
# Pull requests run everything up to and including scan.
# Pushes to main also publish the images and deploy them.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      no_cache:
        description: Build without the layer cache (to measure a cold build)
        type: boolean
        default: false

# Newer commits on a branch or PR cancel older runs. Runs on main never cancel each
# other, so a deploy is never cut off halfway (run_id makes every main run its own group).
# A branch push (refs/heads/x) and its PR (refs/pull/n/merge) are separate groups.
concurrency:
  group: ci-${{ github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_OFF: ${{ inputs.no_cache == true }}

jobs:
