# Deploy = point an environment at the images of one commit.
#
# Every image is pushed once as <service>:sha-<commit> and never changes.
# An environment is a moving tag on top of that: <service>:stg, <service>:prod.
# Deploying moves the tag and keeps the one it replaced as <service>:<env>-previous,
# which is what the rollback workflow goes back to.
#
# An environment only moves forward unless allow_older is set: when two main runs
# finish out of order, the older one leaves the newer release in place.
#
# When the Kubernetes milestone starts, only the "Promote" step changes: it will
# write the image digests into the manifests Argo CD watches instead of moving tags.
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        description: Commit SHA (short or full) whose images to deploy
        type: string
        required: true
      allow_older:
        description: Allow going back to an older commit (rollback)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [stg, prod]
        required: true
      version:
        description: Commit SHA (short or full) whose images to deploy
        type: string
        required: true
      allow_older:
        description: Allow going back to an older commit (rollback)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Protection rules live on the environment: production has required reviewers,
    # so this job waits for approval there before it starts.
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      ALLOW_OLDER: ${{ inputs.allow_older }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve version
        run: |
          full="$(git rev-parse --verify --quiet "${VERSION}^{commit}")" || {
            echo "::error::'${VERSION}' is not a commit in this repository."
            exit 1
          }
          echo "VERSION=${full}" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote
        run: bash ci/deploy.sh "$ENVIRONMENT" "$VERSION"
