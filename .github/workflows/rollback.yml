# One-click rollback: Actions > rollback > Run workflow.
# One command:        gh workflow run rollback.yml -f environment=production
#
# With no version, the environment goes back to the release it ran before the
# current one (<service>:<env>-previous). Running it twice swaps back, like `cd -`.
# Give a version to go further back. It runs through deploy.yml, so a production
# rollback still needs the production approval.
name: rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [stg, prod]
        required: true
      version:
        description: Commit to roll back to (empty = the release before the current one)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    name: find rollback target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.target.outputs.version }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Image name
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: target
        name: Resolve target
        run: |
          if [ -n "$VERSION" ]; then
            target="$VERSION"
          else
            target="$(bash ci/rollback-target.sh "$ENVIRONMENT")"
          fi
          echo "Rolling ${ENVIRONMENT} back to ${target}"
          echo "version=${target}" >> "$GITHUB_OUTPUT"

  rollback:
    name: rollback
    needs: resolve
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      version: ${{ needs.resolve.outputs.version }}
